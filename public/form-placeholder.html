<!--
  This hidden HTML file exists solely for Netlify's build bot to detect the
  "contact" form during post-processing. The actual form lives in the React
  contact page component and submits via JavaScript fetch.
-->
<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field" />
  <input name="name" />
  <input name="email" />
  <input name="phone" />
  <input name="subject" />
  <textarea name="message"></textarea>
</form>
